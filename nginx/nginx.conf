upstream orders { server orders-service:3000; }
upstream catalog { server catalog-service:3001; }
upstream audit { server audit-service:3002; }
upstream reports { server report-service:3003; }
upstream admin { server messaging-admin-service:3004; }

server {
  listen 80;
  server_name _;
  include /etc/nginx/snippets/pedidos360-api-routes.conf;
  location / { return 404; }
}

server {
  listen 3000;
  server_name _;
  include /etc/nginx/snippets/pedidos360-api-routes.conf;
  location /actuator/health {
    proxy_pass http://orders/actuator/health;
  }
  location / { return 404; }
}
