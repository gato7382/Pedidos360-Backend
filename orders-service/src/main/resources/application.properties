server.port=${PORT:3000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos360}
spring.datasource.username=${DB_USER:pedidos360}
spring.datasource.password=${DB_PASSWORD:pedidos360_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=snappy
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USER:pedidos360}
spring.rabbitmq.password=${RABBIT_PASSWORD:pedidos360_local}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
management.endpoints.web.exposure.include=health
