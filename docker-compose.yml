name: pedidos360-backend

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-kafka-node: &kafka-node
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "cub", "kafka-ready", "3", "10", "-b", "localhost:29092"]
    interval: 15s
    timeout: 12s
    start_period: 30s
    retries: 12

x-rabbit-env: &rabbit-env
  RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-local-cookie}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}

x-rabbit-node: &rabbit-node
  image: rabbitmq:4.2.9-management
  restart: unless-stopped
  configs:
    - source: rabbit-cluster
      target: /etc/rabbitmq/conf.d/30-pedidos360.conf
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    start_period: 20s
    retries: 12

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    ports:
      - "0.0.0.0:2181:2181"
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      start_period: 15s
      retries: 12
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    ports:
      - "0.0.0.0:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    ports:
      - "0.0.0.0:9093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    ports:
      - "0.0.0.0:9094:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_READONLY: "false"
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m
    ports:
      - "0.0.0.0:8080:8080"

  rabbit-1:
    <<: *rabbit-node
    hostname: rabbit-1
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit-1
    ports:
      - "0.0.0.0:5672:5672"
      - "0.0.0.0:15672:15672"
    volumes:
      - rabbit-1-data:/var/lib/rabbitmq

  rabbit-2:
    <<: *rabbit-node
    hostname: rabbit-2
    depends_on:
      rabbit-1:
        condition: service_healthy
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit-2
    volumes:
      - rabbit-2-data:/var/lib/rabbitmq

  rabbit-3:
    <<: *rabbit-node
    hostname: rabbit-3
    depends_on:
      rabbit-1:
        condition: service_healthy
      rabbit-2:
        condition: service_healthy
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit-3
    volumes:
      - rabbit-3-data:/var/lib/rabbitmq

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USER:-pedidos360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  catalog-service:
    build:
      context: .
      args:
        SERVICE_MODULE: catalog-service
    restart: unless-stopped
    environment: &backend-env
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Define ENTRA_ISSUER en .env}
      ENTRA_JWKS_URI: ${ENTRA_JWKS_URI:?Define ENTRA_JWKS_URI en .env}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Define ENTRA_AUDIENCE en .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:4200}
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/pedidos360}
      DB_USER: ${DB_USER:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092,kafka-2:29092,kafka-3:29092}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-rabbit-1:5672,rabbit-2:5672,rabbit-3:5672}
      RABBIT_USER: ${RABBITMQ_USER:-admin}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBIT_MANAGEMENT_URL: ${RABBIT_MANAGEMENT_URL:-http://rabbit-1:15672}
    expose: ["3001"]
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      rabbit-1:
        condition: service_healthy
      rabbit-2:
        condition: service_healthy
      rabbit-3:
        condition: service_healthy

  orders-service:
    build:
      context: .
      args:
        SERVICE_MODULE: orders-service
    restart: unless-stopped
    environment:
      <<: *backend-env
      CATALOG_SERVICE_URL: http://catalog-service:3001
    expose: ["3000"]
    depends_on:
      database:
        condition: service_healthy
      catalog-service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      rabbit-1:
        condition: service_healthy
      rabbit-2:
        condition: service_healthy
      rabbit-3:
        condition: service_healthy

  audit-service:
    build:
      context: .
      args:
        SERVICE_MODULE: audit-service
    restart: unless-stopped
    environment:
      <<: *backend-env
      KAFKA_AUDIT_GROUP: audit-group
    expose: ["3002"]
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      rabbit-1:
        condition: service_healthy
      rabbit-2:
        condition: service_healthy
      rabbit-3:
        condition: service_healthy

  report-service:
    build:
      context: .
      args:
        SERVICE_MODULE: report-service
    restart: unless-stopped
    environment:
      <<: *backend-env
      KAFKA_REPORT_GROUP: report-group
    expose: ["3003"]
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  messaging-admin-service:
    build:
      context: .
      args:
        SERVICE_MODULE: messaging-admin-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m
      ENTRA_ISSUER: ${ENTRA_ISSUER:?Define ENTRA_ISSUER en .env}
      ENTRA_JWKS_URI: ${ENTRA_JWKS_URI:?Define ENTRA_JWKS_URI en .env}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Define ENTRA_AUDIENCE en .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:4200}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092,kafka-2:29092,kafka-3:29092}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-rabbit-1:5672,rabbit-2:5672,rabbit-3:5672}
      RABBIT_USER: ${RABBITMQ_USER:-admin}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBIT_MANAGEMENT_URL: ${RABBIT_MANAGEMENT_URL:-http://rabbit-1:15672}
    expose: ["3004"]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      rabbit-1:
        condition: service_healthy
      rabbit-2:
        condition: service_healthy
      rabbit-3:
        condition: service_healthy

  api-proxy:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "${API_PROXY_BIND:-0.0.0.0}:${API_PROXY_PORT:-80}:80"
      - "${HEALTH_BIND:-127.0.0.1}:${HEALTH_PORT:-3000}:3000"
    depends_on:
      orders-service:
        condition: service_started
      catalog-service:
        condition: service_started
      audit-service:
        condition: service_started
      report-service:
        condition: service_started
      messaging-admin-service:
        condition: service_started

configs:
  rabbit-cluster:
    content: |
      cluster_name = pedidos360
      cluster_formation.peer_discovery_backend = classic_config
      cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
      cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
      cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3
      cluster_formation.discovery_retry_limit = 60
      cluster_formation.discovery_retry_interval = 1000

volumes:
  zookeeper-data:
    name: pedidos360-ep5-infra_zookeeper-data
  zookeeper-log:
    name: pedidos360-ep5-infra_zookeeper-log
  kafka-data:
    name: pedidos360-ep5-infra_kafka-data
  kafka-2-data:
    name: pedidos360-ep5-infra_kafka-2-data
  kafka-3-data:
    name: pedidos360-ep5-infra_kafka-3-data
  rabbit-1-data:
    name: pedidos360-ep5-infra_rabbit-1-data
  rabbit-2-data:
    name: pedidos360-ep5-infra_rabbit-2-data
  rabbit-3-data:
    name: pedidos360-ep5-infra_rabbit-3-data
  postgres-data:
    name: pedidos360_postgres-data
